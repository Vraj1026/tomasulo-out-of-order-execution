name: Verify Tomasulo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python -m tomasulo examples/hazards.asm --check --out build/hazards

  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python scripts/verify_rtl.py --backend iverilog
      - run: python scripts/verify_rtl.py --backend iverilog --profile tiny
